name: Extend Contract TTLs

on:
  # Weekly: every Monday at 06:00 UTC. Contract code bumps instance and
  # critical entries on every write (ttl_config::extend_instance_ttl), but
  # contracts that are not called for months still need this off-chain bump.
  # Failures open/update a tracking issue (see the `alert-on-failure` job).
  schedule:
    - cron: "0 6 * * 1"
  # Manual trigger for ad-hoc extension.
  workflow_dispatch:
    inputs:
      network:
        description: "Network to extend TTLs on (testnet or mainnet)"
        required: false
        default: "mainnet"
        type: choice
        options:
          - mainnet
          - testnet
      ledgers_to_extend:
        description: "Number of ledgers to extend TTLs by"
        required: false
        default: "2000000"
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  issues: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # ttl-monitoring: Gate — fail hard if the manifest is absent or incomplete.
  # This guards against silently skipping TTL extension when contracts are
  # live but the manifest was never committed.
  # ──────────────────────────────────────────────────────────────────────────
  ttl-monitoring:
    name: Verify deployment manifest
    runs-on: ubuntu-latest
    outputs:
      network: ${{ steps.pick-network.outputs.network }}
      deployed: ${{ steps.check-manifest.outputs.deployed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target network
        id: pick-network
        run: |
          NETWORK="${{ github.event.inputs.network }}"
          # Default to mainnet for the scheduled run.
          if [ -z "$NETWORK" ]; then
            NETWORK="mainnet"
          fi
          echo "network=${NETWORK}" >> "$GITHUB_OUTPUT"
          echo "Target network: ${NETWORK}"

      - name: Check manifest exists and is complete
        id: check-manifest
        run: |
          NETWORK="${{ steps.pick-network.outputs.network }}"
          MANIFEST="deployments/${NETWORK}.json"

          # The manifest file MUST exist — exit 1 if missing.
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Deployment manifest '${MANIFEST}' not found."
            echo "  Create it by running: ./scripts/deploy_all.sh --network ${NETWORK}"
            echo "  If contracts are not yet deployed, update MAINNET_READINESS.md to"
            echo "  reflect that, and disable this workflow until deployment is complete."
            exit 1
          fi

          # The manifest MUST have _status == "complete".
          STATUS=$(python3 -c "import json, sys; d=json.load(open('$MANIFEST')); print(d.get('_status',''))")
          # A scheduled run before the first deployment has nothing to extend:
          # skip quietly instead of failing (and alerting) every week.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$STATUS" = "not-yet-deployed" ]; then
            echo "::notice::Manifest '${MANIFEST}' is marked not-yet-deployed; skipping scheduled TTL extension."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STATUS" != "complete" ]; then
            echo "::error::Manifest '${MANIFEST}' exists but _status='${STATUS}' (expected 'complete')."
            echo "  Either the deployment did not finish, or contracts are not yet deployed."
            echo "  Check MAINNET_READINESS.md for the current deployment state."
            exit 1
          fi

          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "Manifest '${MANIFEST}' is present and complete."

  # ──────────────────────────────────────────────────────────────────────────
  # extend-ttls: Enumerate deployed contracts from the manifest and bump TTLs.
  # Only runs when ttl-monitoring passes (manifest verified complete).
  # ──────────────────────────────────────────────────────────────────────────
  extend-ttls:
    name: Extend TTLs on ${{ needs.ttl-monitoring.outputs.network }}
    runs-on: ubuntu-latest
    needs: ttl-monitoring
    if: needs.ttl-monitoring.outputs.deployed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli || echo "stellar-cli already installed"

      - name: Configure identity
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          if [ -z "$STELLAR_SECRET_KEY" ]; then
            echo "::error::STELLAR_SECRET_KEY secret is not configured."
            exit 1
          fi
          stellar keys add extender --secret-key "$STELLAR_SECRET_KEY"

      - name: Extend TTLs for all deployed contracts
        env:
          NETWORK: ${{ needs.ttl-monitoring.outputs.network }}
          LEDGERS_TO_EXTEND: ${{ github.event.inputs.ledgers_to_extend || '2000000' }}
        run: |
          export MANIFEST="deployments/${NETWORK}.json"

          # Extract contract IDs - skip metadata keys that start with "_".
          CONTRACT_IDS=$(python3 - <<'EOF'
          import json, sys, os
          with open(os.environ["MANIFEST"]) as f:
              d = json.load(f)
          ids = [v for k, v in d.items() if not k.startswith("_") and v]
          print("\n".join(ids))
          EOF
          )

          if [ -z "$CONTRACT_IDS" ]; then
            echo "No contract IDs found in manifest — nothing to extend."
            exit 0
          fi

          echo "Extending TTLs by ${LEDGERS_TO_EXTEND} ledgers on ${NETWORK}."

          FAILED=0
          SUCCEEDED=0
          FAILED_CONTRACTS=""
          while IFS= read -r contract_id; do
            echo "Extending TTL for contract: ${contract_id}"
            if stellar contract extend \
              --id "$contract_id" \
              --source extender \
              --network "$NETWORK" \
              --ledgers-to-extend "$LEDGERS_TO_EXTEND"; then
              SUCCEEDED=$((SUCCEEDED + 1))
            else
              echo "::warning::Failed to extend TTL for ${contract_id}"
              FAILED=$((FAILED + 1))
              FAILED_CONTRACTS="${FAILED_CONTRACTS}${contract_id}\n"
            fi
          done <<< "$CONTRACT_IDS"

          echo "### TTL Extension Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Network: \`${NETWORK}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ledgers to extend: \`${LEDGERS_TO_EXTEND}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Succeeded: ${SUCCEEDED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed: ${FAILED}" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Contracts that failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            printf "%b" "$FAILED_CONTRACTS" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${FAILED} contract(s) failed to have their TTL extended."
            echo "::error::Re-run this workflow manually (workflow_dispatch) to retry the failed contracts."
            exit 1
          fi

          echo "All contract TTLs extended successfully."

  # ──────────────────────────────────────────────────────────────────────────
  # alert-on-failure: Any failure (manifest gate or extension) opens a
  # tracking issue, or comments on the open one, so a silently failing
  # schedule cannot let contracts drift into archival (#580, #632, #701).
  # ──────────────────────────────────────────────────────────────────────────
  alert-on-failure:
    name: Alert on TTL extension failure
    runs-on: ubuntu-latest
    needs: [ttl-monitoring, extend-ttls]
    if: failure()
    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NETWORK: ${{ needs.ttl-monitoring.outputs.network || github.event.inputs.network || 'mainnet' }}
        run: |
          TITLE="Extend Contract TTLs failed (${NETWORK})"
          BODY="The \`Extend Contract TTLs\` workflow failed on \`${NETWORK}\` at $(date -u +%Y-%m-%dT%H:%M:%SZ).

          Run: ${RUN_URL}

          Contracts whose instance entry is archived reject **every** call until restored.
          Follow the manual extension and restore runbook in TTL_POLICY.md before the next scheduled run."
          EXISTING=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
